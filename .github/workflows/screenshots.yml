name: Screenshots

# Renders the card components at real Light Phone III size on an emulator and
# publishes the PNGs. Runs on demand, and on any push that touches the cards,
# the layout or this workflow, so a rendering change cannot land unseen.
#
# The tool itself is not launched. A LightOS tool needs the LightOS server app,
# which on an emulator means a /system/priv-app install. The screenshot test
# renders the composables through Compose's test rule instead, so a plain AOSP
# image is enough.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the PNGs back to docs/screenshots'
        type: boolean
        default: false
  push:
    branches: [screenshots]
    paths:
      - 'tool/src/main/kotlin/com/thelightphone/solitaire/CardView.kt'
      - 'tool/src/main/kotlin/com/thelightphone/solitaire/HomeScreen.kt'
      - 'tool/src/androidTest/**'
      - 'tool/build.gradle.kts'
      - '.github/workflows/screenshots.yml'
      - 'scripts/avd-lp3.sh'
      - 'scripts/screenshots.sh'

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture on an LP3-shaped emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Nested virtualisation is off by default on the hosted runners. Without
      # this the emulator falls back to software and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AVD_NAME: lightos-lp3
        with:
          api-level: 34
          # 'default' is the AOSP image. LightOS has no Play Services, and only a
          # test-keys image accepts the platform key if this ever grows into a
          # system-app setup.
          target: default
          arch: x86_64
          avd-name: lightos-lp3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: ./scripts/avd-lp3.sh
          # Each LINE here runs as its own `sh -c`. No shell variables survive
          # between lines and no multi-line constructs work, so anything with
          # real logic goes in a script file.
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./scripts/screenshots.sh captured

      - name: Check something was captured
        run: |
          shopt -s nullglob
          shots=(captured/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "::error::No PNGs were captured."
            exit 1
          fi
          for f in "${shots[@]}"; do
            printf '%s  ' "$f"; file "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: captured/*.png
          if-no-files-found: error

      # Off by default. A screenshot that changes on every run is commit noise,
      # so look at the artifact first and commit deliberately.
      - name: Commit to docs/screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.commit
        run: |
          mkdir -p docs/screenshots
          cp captured/*.png docs/screenshots/
          if git diff --quiet -- docs/screenshots; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: refresh card screenshots from CI"
          git push
